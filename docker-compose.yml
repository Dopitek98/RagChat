services:
  mongodb-atlas:
    image: mongodb/mongodb-atlas-local:latest
    container_name: mongodb-atlas
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: admin
      MONGODB_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  vite-app-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
    restart: unless-stopped
    depends_on:
      - mongodb-atlas

  vite-app-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  mongodb_data:
