services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: ragchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: embedding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vite-app-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express-api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    restart: unless-stopped
    depends_on:
      - postgres

  vite-app-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      sleep 3 &&
      ollama pull qwen3.5:4b &&
      ollama pull qwen3-embedding:latest &&
      wait"

volumes:
  postgres_data:
  ollama_data:
