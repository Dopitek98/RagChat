services:
  mongodb-atlas:
    image: mongodb/mongodb-atlas-local:latest
    container_name: mongodb-atlas
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: admin
      MONGODB_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  vite-app-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
    restart: unless-stopped
    depends_on:
      - mongodb-atlas

  vite-app-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      sleep 3 &&
      ollama pull qwen3.5:4b &&
      ollama pull qwen3-embedding:latest &&
      wait"

volumes:
  mongodb_data:
  ollama_data:
